<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management</title>
    <link rel="stylesheet" href="./styles/style.css">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .floating-module {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1050;
            display: none;
        }
        .gotop {
            position: fixed;
            bottom: 2%;
            right: -15px;
            transform: translate(-50%, -50%);
            z-index: 1050;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
       <div class="container" id="serach">
        <div class="TopHeading d-flex px-4 justify-content-between align-items-center">
            <div class="dataIntrections">
                <button id="uploadButton" class="btn btn-sm btn-light"><i class="fa fa-upload" aria-hidden="true"></i></button>
            </div>
            <div class="heading">
                <h1 class="text-light">
                    Extension Finder 
                </h1>
            </div>
            <button id="addButton" class="btn btn-sm btn-success"><i class="fa fa-plus"></i></button>
        </div>
        <center><input type="text" id="myInput" placeholder="Search..." class="form-control mb-3"></center>
       </div>
            <table id="dataTable" class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Extension</th>
                        <th>Department</th>
                        <th style="width: 420px o !important;">User</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        <a href="#serach"><button type="button"  class="btn btn-md btn-primary gotop"><i class="fa fa-arrow-up text-light" aria-hidden="true"></i></button></a>
    </div>

    <div id="editModule" class="floating-module card">
        <div class="card-body">
            <h5 class="card-title">Edit Contact</h5>
            <form id="editForm">
                <label for="editExtension">Extension:</label><br>
                <input type="text" id="editExtension" name="extension" class="form-control"><br>
                <label for="editDepartment">Department:</label><br>
                <input type="text" id="editDepartment" name="department" class="form-control"><br>
                <label for="editUser">User:</label><br>
                <input type="text" id="editUser" name="user" class="form-control"><br><br>
                <button type="submit" class="btn btn-primary">Update</button>
                <button type="button" id="cancelEdit" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <div id="addModule" class="floating-module card">
        <div class="card-body">
            <h5 class="card-title">Add Contact</h5>
            <form id="addForm">
                <label for="addExtension">Extension:</label><br>
                <input type="text" id="addExtension" name="extension" class="form-control"><br>
                <label for="addDepartment">Department:</label><br>
                <input type="text" id="addDepartment" name="department" class="form-control"><br>
                <label for="addUser">User:</label><br>
                <input type="text" id="addUser" name="user" class="form-control"><br><br>
                <button type="submit" class="btn btn-success">Add</button>
                <button type="button" id="cancelAdd" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <div id="uploadModule" class="floating-module card">
        <div class="card-body">
            <div class="media d-flex justify-content-between">
                <h5 class="card-title">Upload Contact File</h5>
                <button id="downloadButton" class="btn btn-sm btn-dark"  data-bs-toggle="tooltip" data-bs-placement="bottom" title="Download Excel"><i class="fa fa-download" aria-hidden="true"></i></button>
            </div>
            <form id="uploadForm">
                <label for="UploadExtension">file:</label><br>
                <input type="file" id="UploadExtension" name="file" class="form-control"><br>
                <button type="submit" class="btn btn-success">upload</button>
                <button type="button" id="cancelupload" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <script src="./scripts/script.js"></script>
</body>
</html>
